<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Note Block Maestro</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <style>
        @font-face {
            font-family: 'Miracode';
            src: url('./assets/Miracode.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        :root {
            --bg: #263238;
            --surface: #37474f;
            --accent: #ffb300;
            --txt: #eceff1;
            --good: #2e7d32;
            --bad: #c62828;
            font-size: 16px
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Miracode', 'Courier New', monospace
        }
        body {
            background: var(--bg);
            color: var(--txt);
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }
        header {
            background: #455a64;
            padding: .8rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem
        }
        header h1 {
            font-size: 1.4rem;
            color: var(--accent);
            flex: 1
        }
        nav a {
            color: var(--txt);
            margin-right: 1rem;
            text-decoration: none
        }
        nav a.active,
        nav a:hover {
            color: var(--accent)
        }
        main {
            flex: 1;
            padding: 1rem;
            max-width: 1100px;
            margin: auto
        }
        .card {
            background: var(--surface);
            padding: 1rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 1rem
        }
        h2 {
            margin-bottom: .5rem;
            color: var(--accent)
        }
        h3 {
            margin-bottom: .8rem;
            margin-top: 1rem;
            color: var(--accent)
        }
        .param-group {
            margin-bottom: 1.2rem;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 6px;
        }
        .param-row {
            margin-bottom: 0.8rem;
        }
        .param-row:last-child {
            margin-bottom: 0;
        }
        /* Responsive scaling for larger screens */
        @media(min-width: 1200px) {
            :root {
                font-size: 18px;
            }
            main {
                max-width: 1400px;
                padding: 2rem;
            }
            .card {
                padding: 1.5rem 2rem;
                margin-bottom: 1.5rem;
            }
            .param-group {
                padding: 1.2rem;
                margin-bottom: 1.6rem;
            }
            .param-row {
                margin-bottom: 1rem;
            }
        }
        @media(min-width: 1600px) {
            :root {
                font-size: 20px;
            }
            main {
                max-width: 1600px;
                padding: 2.5rem;
            }
        }
        table {
            width: 100%;
            border-collapse: collapse
        }
        th,
        td {
            padding: .5rem .4rem;
            text-align: left
        }
        tr:nth-child(even) {
            background: rgba(0, 0, 0, .07)
        }
        button,
        select,
        input[type=file] {
            font: inherit
        }
        input[type=file] {
            padding: 0.6rem;
            border: 2px dashed var(--accent);
            border-radius: 8px;
            background: rgba(255, 179, 0, 0.1);
            color: var(--txt);
            width: 100%;
            margin-bottom: 1rem;
        }
        input[type=file]::file-selector-button {
            font-family: 'Miracode', 'Courier New', monospace;
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            margin-right: 0.8rem;
            cursor: pointer;
        }
        button {
            cursor: pointer;
            padding: .4rem .8rem;
            border: none;
            border-radius: 4px;
            color: var(--bg);
            background: var(--accent);
            margin-right: .4rem;
            transition: all 0.2s ease;
        }
        button:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background: #ffc107;
            transform: translateY(-1px);
        }
        button.danger {
            background: var(--bad);
            color: #fff
        }
        button.good {
            background: var(--good);
            color: #fff
        }
        input[type=text] {
            padding: .3rem .4rem;
            border-radius: 4px;
            border: 1px solid #666;
            background: #263238;
            color: #fff;
            width: 100%
        }
        @media(max-width:700px) {
            table, thead, tbody, tr, td, th {
                display: block
            }
            tr {
                margin-bottom: .8rem
            }
            td {
                padding-left: 50%;
                position: relative
            }
            td:before {
                content: attr(data-label);
                position: absolute;
                left: .4rem;
                top: 0;
                font-weight: 700
            }
            thead {
                display: none
            }
        }
        .tooltip {
            position: relative
        }
        .tooltip:hover:after {
            content: attr(data-tip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            padding: .3rem .5rem;
            border-radius: 4px;
            font-size: .8rem;
            white-space: pre;
            z-index: 10
        }
        .flash {
            padding: .5rem;
            border-radius: 4px;
            margin: .4rem 0
        }
        .flash.ok {
            background: var(--good)
        }
        .flash.err {
            background: var(--bad)
        }
        .hidden {
            display: none
        }
    </style>
</head>

<body>
    <header>
        <h1>🎵 Note Block Maestro</h1>
        <nav>
            <a href="#dashboard" id="lnkDash">Dashboard</a>
            <a href="#convert" id="lnkConv">Convert</a>
            <a href="#quick" id="lnkTemp">Quick Convert</a>
        </nav>
    </header>

    <main id="app"></main>

    <script>
        // reactive helper
        const h = (t, attrs = {}, ...c) => {
            const e = document.createElement(t);
            for (const k in attrs) {
                if (k === 'className') {
                    e.className = attrs[k];
                } else if (k === 'onclick') {
                    // Handle onclick specially to ensure it's properly bound
                    e.addEventListener('click', attrs[k]);
                    console.log('Event listener added to', t, 'element');
                } else if (k.startsWith('on')) {
                    // Handle other event handlers
                    const eventType = k.slice(2); // remove 'on' prefix
                    e.addEventListener(eventType, attrs[k]);
                    console.log('Event listener added for', eventType, 'to', t, 'element');
                } else {
                    e.setAttribute(k, attrs[k]);
                }
            }
            c.flat().forEach(x => e.append(x));
            return e
        }

        const state = {
            songs: [],
            playlists: [],
            flash: [],
            currentFile: null,
            currentFiles: [],
            convertParams: {},
            quickParams: {}
        }
        const api = (u, opts = {}) => fetch(u, opts).then(r => r.ok ? r.json() : Promise.reject(r))

        // dashboard
        const viewDash = () => [
            h('div', {
                    className: 'card'
                }, h('h2', {}, 'Converted Songs'),
                state.songs.length ? songTable() : h('p', {}, 'No songs yet.')
            ),
            h('div', {
                    className: 'card'
                }, h('h2', {}, 'Playlists'),
                playlistSection()
            )
        ]

        const songTable = () => h('table', {},
            h('thead', {}, h('tr', {},
                'Name,Created,Actions'.split(',').map(t => h('th', {}, t))
            )),
            h('tbody', {}, state.songs.map(s =>
                h('tr', {},
                    h('td', {
                            'data-label': 'Name'
                        },
                        h('input', {
                            type: 'text',
                            value: s.name,
                            onchange: e => renameSong(s.id, e.target.value)
                        })),
                    h('td', {
                        'data-label': 'Created'
                    }, s.created.replace('T', ' ').replace('Z', '')),
                    h('td', {
                            'data-label': 'Actions'
                        },
                        h('button', {
                            onclick: () => download(s.id, s.files)
                        }, 'Download'),
                        h('button', {
                            className: 'danger',
                            onclick: () => delSong(s.id)
                        }, 'Delete'))
                )))
        )

        const renameSong = (id, newName) => {
            api('/api/songs/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: newName
                    })
                })
                .then(load).then(() => flash('renamed ✓')).catch(() => flash('error renaming', false))
        }

        const delSong = id => {
            console.log('Delete button clicked!', { id });
            if (!confirm('Delete song?')) return
            console.log('User confirmed deletion, making API call...');
            api('/api/songs/' + id, {
                    method: 'DELETE'
                }).then(load)
                .then(() => flash('deleted ✓')).catch(() => flash('delete failed', false))
        }

        const download = (songId, files) => {
            console.log('Download button clicked!', { songId, files });
            // Create a zip download by redirecting to a new endpoint we'll create
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/api/download';
            form.style.display = 'none';
            
            const songIdInput = document.createElement('input');
            songIdInput.type = 'hidden';
            songIdInput.name = 'song_id';
            songIdInput.value = songId;
            
            form.appendChild(songIdInput);
            document.body.appendChild(form);
            console.log('Submitting form to:', form.action);
            form.submit();
            document.body.removeChild(form);
        }

        const playlistSection = () => {
            const form = h('div', {},
                h('h3', {}, 'Create new'),
                h('input', {
                    type: 'text',
                    placeholder: 'Playlist name',
                    id: 'plname'
                }),
                h('div', {}, state.songs.map(s =>
                    h('label', {},
                        h('input', {
                            type: 'checkbox',
                            value: s.id
                        }), ' ', s.name, '  ')
                )),
                h('button', {
                    onclick: () => mkpls(form)
                }, 'Save')
            )
            const list = state.playlists.map(p =>
                h('div', {
                        style: 'margin:.4rem 0'
                    },
                    h('strong', {}, p.name), ' (', p.songs.length, ' songs) ',
                    h('button', {
                        className: 'danger',
                        onclick: () => delPl(p.id)
                    }, 'Delete'))
            )
            return h('div', {}, form, ...list)
        }

        const mkpls = frm => {
            console.log('Playlist save button clicked!');
            const name = frm.querySelector('#plname').value.trim()
            const songs = [...frm.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value)
            console.log('Creating playlist:', { name, songs });
            api('/api/playlists', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        songs
                    })
                })
                .then(load).then(() => flash('playlist saved ✓')).catch(() => flash('error', false))
        }

        const delPl = id => {
            console.log('Playlist delete button clicked!', { id });
            if (!confirm('Delete playlist?')) return
            console.log('User confirmed playlist deletion, making API call...');
            api('/api/playlists/' + id, {
                    method: 'DELETE'
                }).then(load)
                .then(() => flash('playlist deleted')).catch(() => flash('error', false))
        }

        // convert
        const viewConvert = () => {
            const fileInput = h('input', {
                type: 'file',
                multiple: true,
                accept: Object.keys(ALLOWED_EXT).map(e => '.' + e).join(','),
                onchange: e => {
                    console.log('Files selected:', e.target.files);
                    state.currentFiles = [...e.target.files];
                    render()
                }
            })

            const fileStatus = () => {
                if (!state.currentFiles.length) {
                    return h('p', { style: 'color: #888; margin: 0.5rem 0; font-style: italic;' }, 'No files selected')
                }
                return h('div', { style: 'margin: 0.5rem 0;' },
                    h('p', { style: 'color: var(--accent); font-weight: bold;' }, 
                        `${state.currentFiles.length} file${state.currentFiles.length > 1 ? 's' : ''} selected:`),
                    h('ul', { style: 'margin: 0.3rem 0; padding-left: 1.2rem;' },
                        ...state.currentFiles.map(f => 
                            h('li', { style: 'color: var(--txt); margin: 0.2rem 0;' }, f.name)
                        )
                    )
                )
            }

            const grid = () => {
                if (!state.currentFiles.length) return ''
                return h('div', {},
                    h('h3', {}, 'Master Controls'),
                    paramControls(state.convertParams),
                    ...state.currentFiles.map(f => {
                        // Create per-file params if they don't exist
                        if (!state.convertParams[f.name]) {
                            state.convertParams[f.name] = {};
                        }
                        return h('div', {
                                className: 'card',
                                style: 'background:#455a64;margin-top:1rem'
                            },
                            h('h4', { style: 'color: var(--accent); margin-bottom: 0.8rem;' }, `File: ${f.name}`),
                            paramControls(state.convertParams[f.name])
                        )
                    })
                )
            }

            const submit = () => {
                console.log('Convert button clicked!', { files: state.currentFiles });
                if (!state.currentFiles.length) {
                    console.log('No files selected, aborting...');
                    return
                }
                console.log('Preparing form data with files:', state.currentFiles.map(f => f.name));
                const fd = new FormData()
                state.currentFiles.forEach(f => fd.append('files', f))
                
                // Separate global and per-file params
                const globalParams = { ...state.convertParams };
                const perFileParams = {};
                
                // Remove per-file params from global params
                state.currentFiles.forEach(f => {
                    if (globalParams[f.name]) {
                        perFileParams[f.name] = globalParams[f.name];
                        delete globalParams[f.name];
                    }
                });
                
                fd.append('global_params', JSON.stringify(globalParams))
                fd.append('per_file_params', JSON.stringify(perFileParams))
                console.log('Sending upload request...');
                fetch('/api/upload', {
                        method: 'POST',
                        body: fd
                    })
                    .then(r => r.json()).then(res => {
                        console.log('Upload response:', res);
                        res.forEach(r => flash(`${r.file}: ${r.ok?'✓':'✗'}`, r.ok))
                        load()
                    }).catch(err => {
                        console.error('Upload failed:', err);
                        flash('upload failed', false)
                    })
            }

            return [h('div', {
                    className: 'card'
                },
                h('h2', {}, 'Batch Convert'),
                h('p', { style: 'margin-bottom: 1rem; color: #aaa;' }, 'Convert up to 20 files at once with individual or shared settings.'),
                fileInput,
                fileStatus(),
                grid(),
                h('button', {
                    onclick: submit,
                    style: 'margin-top:1.5rem; padding: 0.8rem 1.5rem; font-size: 1.1em;',
                    disabled: !state.currentFiles.length
                }, 'Start Conversion'))]
        }

        const paramControls = target => {
            // Initialize default values if not set
            if (!target.resolution) target.resolution = '';
            if (!target.speed) target.speed = 1;
            if (!target.volume) target.volume = 1;
            if (!target.transpose) target.transpose = 0;
            if (!target.strum_affinity) target.strum_affinity = 1;
            if (target.invert_key === undefined) target.invert_key = false;
            if (target.drums === undefined) target.drums = true;
            if (target.mc_legal === undefined) target.mc_legal = false;
            if (!target.max_distance) target.max_distance = 42;
            if (target.command_blocks === undefined) target.command_blocks = false;
            if (target.minecart_improvements === undefined) target.minecart_improvements = false;

            return h('div', { className: 'param-group' },
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        style: 'display:block;margin-bottom:0.4rem',
                        'data-tip': 'Scales song speed up/down as a multiplier. Range: 0.1-10. Higher = faster.'
                    },
                    'Speed (multiplier): ',
                    h('input', {
                        type: 'number',
                        step: '0.1',
                        min: '0.1',
                        max: '10',
                        value: target.speed,
                        style: 'width:100%;margin-top:0.2rem',
                        onchange: e => target.speed = parseFloat(e.target.value) || 1
                    }))),
                
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        style: 'display:block;margin-bottom:0.4rem',
                        'data-tip': 'Scales volume of all notes. Range: 0.1-5. Higher = louder.'
                    },
                    'Volume (multiplier): ',
                    h('input', {
                        type: 'number',
                        step: '0.1',
                        min: '0.1',
                        max: '5',
                        value: target.volume,
                        style: 'width:100%;margin-top:0.2rem',
                        onchange: e => target.volume = parseFloat(e.target.value) || 1
                    }))),
                
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        style: 'display:block;margin-bottom:0.4rem',
                        'data-tip': 'Transposes song up/down in semitones. Range: -24 to +24. Higher = higher pitched.'
                    },
                    'Transpose (semitones): ',
                    h('input', {
                        type: 'number',
                        min: '-24',
                        max: '24',
                        value: target.transpose,
                        style: 'width:100%;margin-top:0.2rem',
                        onchange: e => target.transpose = parseInt(e.target.value) || 0
                    }))),
                
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        style: 'display:block;margin-bottom:0.4rem',
                        'data-tip': 'Target time resolution in hertz (per-second). Range: 1-100. Defaults to 20 for Minecraft outputs, 40 otherwise.'
                    },
                    'Resolution (Hz): ',
                    h('input', {
                        type: 'number',
                        min: '1',
                        max: '100',
                        value: target.resolution,
                        placeholder: 'Auto (20/40)',
                        style: 'width:100%;margin-top:0.2rem',
                        onchange: e => target.resolution = e.target.value ? parseInt(e.target.value) : ''
                    }))),
                
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        style: 'display:block;margin-bottom:0.4rem',
                        'data-tip': 'Threshold for sustained notes to be cut into segments. Range: 0.1-10. Higher = more notes.'
                    },
                    'Strum Affinity: ',
                    h('input', {
                        type: 'number',
                        step: '0.1',
                        min: '0.1',
                        max: '10',
                        value: target.strum_affinity,
                        style: 'width:100%;margin-top:0.2rem',
                        onchange: e => target.strum_affinity = parseFloat(e.target.value) || 1
                    }))),
                
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        'data-tip': 'Experimental: Auto-detects song key signature and inverts it (C Major ↔ C Minor)'
                    },
                    h('input', {
                        type: 'checkbox',
                        checked: target.invert_key,
                        onchange: e => target.invert_key = e.target.checked
                    }), ' Invert Key (Experimental)')),
                
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        'data-tip': 'Allows percussion channel. If disabled, percussion channels will be treated as regular instrument channels.'
                    },
                    h('input', {
                        type: 'checkbox',
                        checked: target.drums,
                        onchange: e => target.drums = e.target.checked
                    }), ' Enable Drums')),
                
                h('div', { className: 'param-row' },
                    h('label', {
                        className: 'tooltip',
                        'data-tip': 'Forces song to be vanilla Minecraft compliant. Enables additional Minecraft-specific options.'
                    },
                    h('input', {
                        type: 'checkbox',
                        checked: target.mc_legal,
                        onchange: e => {
                            target.mc_legal = e.target.checked;
                            render(); // Re-render to show/hide MC-specific options
                        }
                    }), ' Minecraft Legal')),
                
                // Minecraft-specific options (only show if mc_legal is enabled)
                ...(target.mc_legal ? [
                    h('div', { className: 'param-row', style: 'margin-left: 1.5rem; padding: 0.8rem; background: rgba(255, 179, 0, 0.1); border-radius: 4px;' },
                        h('h4', { style: 'color: var(--accent); margin-bottom: 0.6rem;' }, 'Minecraft-Specific Options'),
                        
                        h('label', {
                            className: 'tooltip',
                            style: 'display:block;margin-bottom:0.6rem',
                            'data-tip': 'Maximum block distance from center line in increments of 3. Range: 3-150. Lower = more compact, less volume accuracy.'
                        },
                        'Max Distance: ',
                        h('input', {
                            type: 'number',
                            min: '3',
                            max: '150',
                            step: '3',
                            value: target.max_distance,
                            style: 'width:100%;margin-top:0.2rem',
                            onchange: e => target.max_distance = parseInt(e.target.value) || 42
                        })),
                        
                        h('label', {
                            className: 'tooltip',
                            style: 'display:block;margin:0.6rem 0',
                            'data-tip': 'Enables command blocks for notes requiring fine-tune/pitchbend. Not survival-legal.'
                        },
                        h('input', {
                            type: 'checkbox',
                            checked: target.command_blocks,
                            onchange: e => target.command_blocks = e.target.checked
                        }), ' Command Blocks (Not Survival Legal)'),
                        
                        h('label', {
                            className: 'tooltip',
                            'data-tip': 'Assumes server is running Minecart Improvements mod. Reduces powered rails on main track.'
                        },
                        h('input', {
                            type: 'checkbox',
                            checked: target.minecart_improvements,
                            onchange: e => target.minecart_improvements = e.target.checked
                        }), ' Minecart Improvements'))
                ] : [])
            )
        }

        // ephemeral convert
        const viewQuick = () => {
            const fileInput = h('input', {
                type: 'file',
                accept: Object.keys(ALLOWED_EXT).map(e => '.' + e).join(','),
                onchange: e => {
                    console.log('File input changed:', e.target.files[0]);
                    state.currentFile = e.target.files[0];
                    render()
                }
            })
            
            const fileStatus = () => {
                if (!state.currentFile) {
                    return h('p', { style: 'color: #888; margin: 0.5rem 0; font-style: italic;' }, 'No file selected')
                }
                return h('p', { style: 'color: var(--accent); margin: 0.5rem 0; font-weight: bold;' }, 
                    `Selected: ${state.currentFile.name}`)
            }
            
            const submit = () => {
                console.log('Quick convert button clicked!', { file: state.currentFile });
                if (!state.currentFile) {
                    console.log('No file selected, aborting...');
                    return
                }
                console.log('Preparing quick convert with params:', state.quickParams);
                const fd = new FormData()
                fd.append('file', state.currentFile)
                fd.append('params', JSON.stringify(state.quickParams))
                console.log('Sending ephemeral convert request...');
                fetch('/api/convert-ephemeral', {
                        method: 'POST',
                        body: fd
                    })
                    .then(r => {
                        console.log('Ephemeral convert response status:', r.status);
                        if (!r.ok) throw 0;
                        return r.blob()
                    })
                    .then(b => {
                        console.log('Got blob, creating download...');
                        const url = URL.createObjectURL(b);
                        const a = document.createElement('a')
                        a.href = url;
                        a.download = state.currentFile.name.replace(/\.\w+$/, '_mc.zip');
                        a.click();
                        URL.revokeObjectURL(url)
                        flash('download ready')
                    }).catch(err => {
                        console.error('Quick convert failed:', err);
                        flash('fail', false)
                    })
            }
            
            return [h('div', {
                    className: 'card'
                },
                h('h2', {}, 'Quick Convert (No Storage)'),
                h('p', { style: 'margin-bottom: 1rem; color: #aaa;' }, 'Convert a single file and download immediately without saving to the server.'),
                fileInput,
                fileStatus(),
                state.currentFile ? paramControls(state.quickParams) : '',
                h('button', {
                    onclick: submit,
                    style: 'margin-top:1.5rem; padding: 0.8rem 1.5rem; font-size: 1.1em;',
                    disabled: !state.currentFile
                }, 'Convert & Download')
            )]
        }

        // allowed file extensions for upload
        const ALLOWED_EXT = {
            mid: 1,
            midi: 1,
            nbs: 1,
            org: 1,
            zip: 1,
            csv: 1
        }

        const render = () => {
            const app = document.getElementById('app');
            app.innerHTML = ''
            location.hash ||= '#dashboard'
            const route = location.hash.replace('#', '')
            document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.hash === location.hash))
            const flashes = state.flash.map(f => h('div', {
                className: 'flash ' + (f.ok ? 'ok' : 'err')
            }, f.msg))
            app.append(...flashes,
                ...(route === 'dashboard' ? viewDash() :
                    route === 'convert' ? viewConvert() : viewQuick()))
        }

        const flash = (msg, ok = true) => {
            state.flash.push({
                msg,
                ok
            });
            render();
            setTimeout(() => {
                state.flash.shift();
                render()
            }, 4e3)
        }

        const load = () => Promise.all([api('/api/songs'), api('/api/playlists')])
            .then(([songs, pl]) => {
                console.log('Data loaded successfully:', { songs, playlists: pl });
                state.songs = songs;
                state.playlists = pl;
                render()
            })
            .catch(err => {
                console.error('Failed to load data:', err);
                flash('server offline', false)
            })

        window.addEventListener('hashchange', render)
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM Content Loaded - initializing app...');
            load();
            render()
        })
    </script>
</body>

</html>
